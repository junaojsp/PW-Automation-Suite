name: FarmZilla The Classic - Diagnóstico x86
on:
  workflow_dispatch:
  push:
    paths:
      - 'FarmZilla/TheClassic/**'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/GameSignatures*.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/Bridge.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/ProcessGate.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/AttackService.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/RubiPalette.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZillaFrame.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/SideItem.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/Theme.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/TickBox.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/UiScale.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/ClassIcons.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZilla.ico'
      - '.github/workflows/farmzilla-tclassic-build.yml'
  pull_request:
    paths:
      - 'FarmZilla/TheClassic/**'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/GameSignatures*.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/Bridge.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/ProcessGate.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/AttackService.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/RubiPalette.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZillaFrame.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/SideItem.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/Theme.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/TickBox.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/UiScale.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/ClassIcons.cs'
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZilla.ico'
      - '.github/workflows/farmzilla-tclassic-build.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e testar diagnóstico separado
        shell: pwsh
        run: ./FarmZilla/TheClassic/Build-Diagnostic.ps1
      - name: Disponibilizar diagnóstico The Classic
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-TheClassic-0.5.0-TESTE-x86
          path: |
            FarmZilla/TheClassic/artifacts/FarmZilla-TheClassic-Diagnostico.exe
            FarmZilla/TheClassic/artifacts/FarmZilla-TheClassic-Teste.exe
            FarmZilla/TheClassic/artifacts/espelho-layout.png
            FarmZilla/TheClassic/artifacts/SHA256.txt
            FarmZilla/TheClassic/artifacts/diagnostico-layout.png
            FarmZilla/TheClassic/README.md
            FarmZilla/TheClassic/PROFILE.md
          if-no-files-found: error
          retention-days: 14
