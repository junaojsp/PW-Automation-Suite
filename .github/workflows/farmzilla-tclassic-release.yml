name: FarmZilla The Classic - Executável x86
on:
  workflow_dispatch:
  push:
    paths:
      - 'FarmZilla/TheClassic/FarmZilla-Classic/**'
      - 'FarmZilla/TheClassic/Build-Classic.ps1'
      - 'FarmZilla/TheClassic/ClassicReleaseTests.cs'
      - '.github/workflows/farmzilla-tclassic-release.yml'
  pull_request:
    paths:
      - 'FarmZilla/TheClassic/FarmZilla-Classic/**'
      - 'FarmZilla/TheClassic/Build-Classic.ps1'
      - 'FarmZilla/TheClassic/ClassicReleaseTests.cs'
      - '.github/workflows/farmzilla-tclassic-release.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar FarmZilla-Classic.exe e testar
        shell: pwsh
        run: ./FarmZilla/TheClassic/Build-Classic.ps1
      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-Classic-0.6.1-x86
          path: |
            FarmZilla/TheClassic/artifacts/FarmZilla-Classic.exe
            FarmZilla/TheClassic/artifacts/SHA256-Classic.txt
          if-no-files-found: error
          retention-days: 30
