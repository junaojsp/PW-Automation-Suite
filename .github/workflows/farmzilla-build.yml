name: FarmZilla - Compilar Windows x86

on:
  workflow_dispatch:
  push:
    paths:
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/**'
      - 'FarmZilla/FarmZilla/work/Build-Release.ps1'
      - 'FarmZilla/FarmZilla/work/*Tests.cs'
      - 'FarmZilla/FarmZilla/work/LayoutPreview.cs'
      - '.github/workflows/farmzilla-build.yml'
      - '.github/workflows/farmzilla-publish.yml'
      - 'FarmZilla/FarmZilla/work/ssh/**'
      - 'FarmZilla/FarmZilla/work/farmzilla-control-linux/app/**'
  pull_request:
    paths:
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/**'
      - 'FarmZilla/FarmZilla/work/Build-Release.ps1'
      - 'FarmZilla/FarmZilla/work/*Tests.cs'
      - 'FarmZilla/FarmZilla/work/LayoutPreview.cs'
      - '.github/workflows/farmzilla-build.yml'
      - '.github/workflows/farmzilla-publish.yml'
      - 'FarmZilla/FarmZilla/work/ssh/**'
      - 'FarmZilla/FarmZilla/work/farmzilla-control-linux/app/**'

permissions:
  contents: read

jobs:
  build:
    name: FarmZilla .NET Framework Windows x86
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FarmZilla/FarmZilla
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar e executar verificacoes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./work/Build-Release.ps1
          if (-not $?) { throw 'Compilacao ou testes falharam' }
          $output = './outputs/FarmZilla-0.51.20'
          if (-not (Test-Path "$output/FarmZilla.exe")) { throw 'FarmZilla.exe nao encontrado' }
          $a = (Get-FileHash "$output/FarmZilla.exe" -Algorithm SHA256).Hash
          Write-Host "FarmZilla.exe compilado: $a"

      - name: Validar PE, assinatura e gerar relatorio de seguranca
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = './outputs/FarmZilla-0.51.20/FarmZilla.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Arquivo nao e executavel PE valido' }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Assinatura Authenticode: $($signature.Status)"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          $meta = (Get-Item $exe).VersionInfo
          if ($meta.FileVersion -ne '0.51.34.0') { throw "Versao inesperada: $($meta.FileVersion)" }
          $lines = @(
            'FarmZilla 0.51.34 - verificacao de artefato'
            "SHA-256: $hash"
            "Versao: $($meta.FileVersion)"
            "Assinatura Authenticode: $($signature.Status)"
            'Aviso: build e hash nao comprovam ausencia de malware.'
            'Uma assinatura digital de fornecedor verificado deve ser configurada antes da distribuicao ampla.'
          )
          Set-Content -Path './farmzilla-security-report.txt' -Value $lines -Encoding UTF8

      - name: Conferir e capturar layout Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $sources = @(Get-ChildItem './outputs/FarmZilla-0.51.20' -Filter '*.cs' -File | ForEach-Object FullName)
          $preview = (Resolve-Path './work/LayoutPreview.cs').Path
          $previewExe = Join-Path (Get-Location) 'layout-preview.exe'
          & $compiler /nologo /target:exe /platform:x86 /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll /r:System.Management.dll /main:LayoutPreview "/out:$previewExe" $preview $sources
          if ($LASTEXITCODE -ne 0) { throw 'Falha compilando previa' }
          & ./layout-preview.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falha conferindo layout' }

      - name: Disponibilizar previa do layout
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-0.51.34-layout
          path: |
            FarmZilla/FarmZilla/farmzilla-layout.png
            FarmZilla/FarmZilla/farmzilla-frost-layout.png
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatorio de verificacao
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-0.51.34-verificacao
          path: FarmZilla/FarmZilla/farmzilla-security-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar executavel para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-0.51.34-PUBLICAR
          path: FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZilla.exe
          if-no-files-found: error
          retention-days: 14

  control-tests:
    name: Validar publicação e PostgreSQL
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: farmzilla_test
          POSTGRES_USER: fztest
          POSTGRES_PASSWORD: fztest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fztest -d farmzilla_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: FarmZilla-0.51.34-PUBLICAR
          path: test-artifact
      - name: Testar PE real, cadastros equivalentes, publicação, backup e recuperação
        working-directory: FarmZilla/FarmZilla/work/farmzilla-control-linux/app
        env:
          TEST_DATABASE_URL: postgres://fztest:fztest@localhost:5432/farmzilla_test
          FZ_TEST_EXE: ${{ github.workspace }}/test-artifact/FarmZilla.exe
          FZ_TEST_VERSION: 0.51.34.0
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check server.js
          node --test release-store.test.js
      - name: Conferir comandos SSH e scripts do workflow
        run: |
          bash -n FarmZilla/FarmZilla/work/ssh/farmzilla-github-ssh
          bash -n FarmZilla/FarmZilla/work/ssh/setup-farmzilla-ssh.sh
          bash -n FarmZilla/FarmZilla/work/ssh/install-publication.sh
          node --check FarmZilla/FarmZilla/work/ssh/prepare-publication.cjs
          node --check FarmZilla/FarmZilla/work/ssh/publish-stdin.cjs
