name: FarmZilla - Compilar Windows x86

on:
  workflow_dispatch:
  push:
    paths:
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/**'
      - 'FarmZilla/FarmZilla/work/Build-Release.ps1'
      - 'FarmZilla/FarmZilla/work/*Tests.cs'
      - '.github/workflows/farmzilla-build.yml'
  pull_request:
    paths:
      - 'FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/**'
      - 'FarmZilla/FarmZilla/work/Build-Release.ps1'
      - 'FarmZilla/FarmZilla/work/*Tests.cs'
      - '.github/workflows/farmzilla-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: FarmZilla .NET Framework Windows x86
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FarmZilla/FarmZilla
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar e executar verificacoes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./work/Build-Release.ps1
          if (-not $?) { throw 'Compilacao ou testes falharam' }
          $output = './outputs/FarmZilla-0.51.20'
          if (-not (Test-Path "$output/FarmZilla.exe")) { throw 'FarmZilla.exe nao encontrado' }
          $a = (Get-FileHash "$output/FarmZilla.exe" -Algorithm SHA256).Hash
          Write-Host "FarmZilla.exe compilado: $a"

      - name: Validar PE, assinatura e gerar relatorio de seguranca
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = './outputs/FarmZilla-0.51.20/FarmZilla.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Arquivo nao e executavel PE valido' }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Assinatura Authenticode: $($signature.Status)"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          $meta = (Get-Item $exe).VersionInfo
          if ($meta.FileVersion -ne '0.51.29.0') { throw "Versao inesperada: $($meta.FileVersion)" }
          $lines = @(
            'FarmZilla 0.51.29 - verificacao de artefato'
            "SHA-256: $hash"
            "Versao: $($meta.FileVersion)"
            "Assinatura Authenticode: $($signature.Status)"
            'Aviso: build e hash nao comprovam ausencia de malware.'
            'Uma assinatura digital de fornecedor verificado deve ser configurada antes da distribuicao ampla.'
          )
          Set-Content -Path './farmzilla-security-report.txt' -Value $lines -Encoding UTF8

      - name: Publicar relatorio de verificacao
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-0.51.29-verificacao
          path: FarmZilla/FarmZilla/farmzilla-security-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar executavel para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarmZilla-0.51.29-Windows-x86
          path: FarmZilla/FarmZilla/outputs/FarmZilla-0.51.20/FarmZilla.exe
          if-no-files-found: error
          retention-days: 14
